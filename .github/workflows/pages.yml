name: Pages

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create assets directory
      run: mkdir -p assets

    - name: Generate trophy
      uses: ryo-ma/github-profile-trophy@master
      with:
        username: ${{ github.actor }}
        output_path: ./assets/trophy.svg
        theme: dark_lover
        column: "-1"
        row: "1"
        margin-w: "8"
        margin-h: "8"
        no-bg: "false"
        no-frame: "false"
        order: "4"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload trophy artifact
      uses: actions/upload-artifact@v4
      with:
        name: trophy
        path: ./assets/trophy.svg

  page:
    runs-on: ubuntu-latest
    needs: [generate-trophy]
    steps:
    - uses: actions/checkout@v4

    - name: Download trophy
      uses: actions/download-artifact@v4
      with:
        name: trophy
        path: ./assets

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [page]
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
